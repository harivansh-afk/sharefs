name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: native
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - run: nix develop --command cargo fmt --all --check
      - run: nix develop --command cargo clippy --locked --all-targets -- -D warnings
      - run: nix develop --command cargo test --locked -- --test-threads=1
