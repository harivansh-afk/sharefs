  <div class="head">
    <div class="breadcrumb"></div>
    <div class="toolbox">
      <a class="control action-btn download hidden" aria-label="Download file" download><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-download"/></svg></a>
      <button type="button" class="control action-btn rename-file hidden" data-action="rename" aria-label="Rename file"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-rename"/></svg></button>
      <button type="button" class="control action-btn share-file hidden" data-action="share" aria-label="Share file"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-share"/></svg></button>
      <button type="button" class="control action-btn upload-file hidden" aria-label="Upload files"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-upload"/></svg></button>
      <input type="file" id="file" aria-label="Upload files" multiple hidden>
    </div>
    <form class="searchbar hidden">
      <div class="icon">
        <svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-search"/></svg>
      </div>
      <input id="search" title="Searching for folders or files" name="q" type="text" maxlength="128" autocomplete="off"
        tabindex="1">
      <input type="submit" hidden />
    </form>
    <div class="toolbox-right">
      <a class="shares-link hidden">Shares</a>
      <button type="button" class="action-btn login-btn hidden" aria-label="Log in"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-login"/></svg></button>
      <button type="button" class="action-btn logout-btn hidden" aria-label="Log out"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-logout"/></svg><span class="user-name sr-only"></span></button>
      <button type="button" class="action-btn save-btn hidden" aria-label="Save file"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-save"/></svg></button>
    </div>
  </div>
  <div class="main">
    <div class="index-page hidden">
      <div class="empty-folder hidden"></div>
      <table class="uploaders-table hidden">
        <thead>
          <tr>
            <th class="cell-name" colspan="2">Name</th>
            <th class="cell-status">Progress</th>
          </tr>
        </thead>
      </table>
      <table class="paths-table hidden">
        <colgroup>
          <col class="col-icon"><col class="col-name"><col class="col-mtime"><col class="col-size"><col class="col-actions">
        </colgroup>
        <thead>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <section class="shares-page hidden" aria-label="Shared files">
      <p id="shares-status" role="status">Loading shares…</p>
      <button id="shares-retry" type="button" hidden>Retry</button>
      <table class="shares-table" hidden>
        <colgroup><col><col class="col-created"><col class="col-expiry"><col class="col-actions"></colgroup>
        <thead><tr><th scope="col">File</th><th scope="col" class="cell-created">Created</th><th scope="col">Expires</th><th scope="col" class="cell-actions">Actions</th></tr></thead>
        <tbody></tbody>
      </table>
      <input id="shares-copy-link" aria-label="Share link" readonly hidden>
    </section>
    <div class="editor-page hidden">
      <div class="not-editable hidden"></div>
      <p id="save-status" role="status"></p>
      <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
    </div>
  </div>
  <div id="share-popover" class="action-popover" popover>
    <form id="share-form">
      <select id="share-expiry" aria-label="Link expires after">
        <option value="3600">1 hour</option>
        <option value="86400">1 day</option>
        <option value="604800" selected>7 days</option>
        <option value="2592000">30 days</option>
      </select>
      <button type="submit" class="action-btn" aria-label="Copy link"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-copy"/></svg></button>
      <input id="share-link" aria-label="Share link" readonly hidden>
      <p id="share-status" role="status"></p>
    </form>
  </div>
  <div id="rename-popover" class="action-popover" popover>
    <form id="rename-form">
      <input id="rename-input" aria-label="New name" required autocomplete="off">
      <button type="submit" class="action-btn" aria-label="Rename"><svg class="action-icon" viewBox="0 0 256 256" aria-hidden="true"><use href="#icon-check"/></svg></button>
      <p id="rename-status" role="status"></p>
    </form>
  </div>
