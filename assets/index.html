<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="modulepreload" href="__ASSETS_PREFIX__actions.js">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <div class="head">
    <div class="breadcrumb"></div>
    <div class="toolbox">
      <a href="" class="control download hidden" title="Download file" download="">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path
            d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
          <path
            d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
        </svg>
      </a>
      <button type="button" class="control rename-file hidden" data-action="rename" title="Rename file">Rename</button>
      <button type="button" class="control share-file hidden" data-action="share" title="Share file">Share</button>
      <button type="button" class="control upload-file hidden" title="Upload files" aria-label="Upload files">Upload</button>
      <input type="file" id="file" aria-label="Upload files" multiple hidden>
    </div>
    <form class="searchbar hidden">
      <div class="icon">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path
            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
        </svg>
      </div>
      <input id="search" title="Searching for folders or files" name="q" type="text" maxlength="128" autocomplete="off"
        tabindex="1">
      <input type="submit" hidden />
    </form>
    <div class="toolbox-right">
      <button type="button" class="login-btn hidden" title="Log in" aria-label="Log in">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path fill-rule="evenodd"
            d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z" />
          <path fill-rule="evenodd"
            d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z" />
        </svg>
      </button>
      <button type="button" class="logout-btn hidden" title="Log out" aria-label="Log out">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M10 3.5a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 1 1 0v2A1.5 1.5 0 0 1 9.5 14h-8A1.5 1.5 0 0 1 0 12.5v-9A1.5 1.5 0 0 1 1.5 2h8A1.5 1.5 0 0 1 11 3.5v2a.5.5 0 0 1-1 0z"/>
          <path fill-rule="evenodd" d="M4.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H14.5a.5.5 0 0 1 0 1H5.707l2.147 2.146a.5.5 0 0 1-.708.708z"/>
        </svg>
        <span class="user-name"></span>
      </button>
      <button type="button" class="save-btn hidden" title="Save file" aria-label="Save file">
        <svg viewBox="0 0 1024 1024" width="24" height="24">
          <path
            d="M426.666667 682.666667v42.666666h170.666666v-42.666666h-170.666666z m-42.666667-85.333334h298.666667v128h42.666666V418.133333L605.866667 298.666667H298.666667v426.666666h42.666666v-128h42.666667z m260.266667-384L810.666667 379.733333V810.666667H213.333333V213.333333h430.933334zM341.333333 341.333333h85.333334v170.666667H341.333333V341.333333z"
            p-id="8311"></path>
        </svg>
      </button>
    </div>
  </div>
  <div class="main">
    <div class="index-page hidden">
      <div class="empty-folder hidden"></div>
      <table class="uploaders-table hidden">
        <thead>
          <tr>
            <th class="cell-name" colspan="2">Name</th>
            <th class="cell-status">Progress</th>
          </tr>
        </thead>
      </table>
      <table class="paths-table hidden">
        <colgroup>
          <col class="col-icon"><col class="col-name"><col class="col-mtime"><col class="col-size"><col class="col-actions">
        </colgroup>
        <thead>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <div class="editor-page hidden">
      <div class="not-editable hidden"></div>
      <p id="save-status" role="status"></p>
      <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
    </div>
  </div>
  <div id="file-menu" class="action-popover" popover aria-label="File actions">
    <a id="menu-download" download title="Download file">Download</a>
    <button id="menu-rename" type="button" title="Rename without moving or replacing another file">Rename</button>
  </div>
  <div id="share-popover" class="action-popover" popover>
    <form id="share-form">
      <strong id="share-name"></strong>
      <label for="share-expiry">Link expires after</label>
      <select id="share-expiry">
        <option value="3600">1 hour</option>
        <option value="86400">1 day</option>
        <option value="604800" selected>7 days</option>
        <option value="2592000">30 days</option>
      </select>
      <p>Anyone with the link can read this file.</p>
      <button type="submit">Copy link</button>
      <input id="share-link" aria-label="Share link" readonly hidden>
      <p id="share-status" role="status"></p>
    </form>
  </div>
  <div id="rename-popover" class="action-popover" popover>
    <form id="rename-form">
      <label for="rename-input">New name</label>
      <input id="rename-input" required autocomplete="off">
      <button type="submit">Rename</button>
      <p id="rename-status" role="status"></p>
    </form>
  </div>
  <template id="index-data">__INDEX_DATA__</template>
  <script type="module" src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>
