<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <noscript>
    <meta http-equiv="refresh" content="0; url=?noscript">
  </noscript>
  <link rel="icon" type="image/x-icon" href="__ASSETS_PREFIX__favicon.ico">
  <link rel="icon" type="image/svg+xml" href="__ASSETS_PREFIX__icon.svg">
  <link rel="modulepreload" href="__ASSETS_PREFIX__actions.js">
  <link rel="stylesheet" href="__ASSETS_PREFIX__index.css">
</head>

<body>
  <svg class="icon-definitions" aria-hidden="true"><defs>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2m3 6a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m16 3 5 5-12 12-6 1 1-6Z M14 5l5 5"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="icon-rename" viewBox="0 0 24 24"><path d="M10 3h4m-2 0v18m-2 0h4M7 7H3v10h4m10-10h4v10h-4"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="1"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M4 3h13l4 4v14H3V3Zm3 0v6h9V3M7 21v-8h10v8"/></symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M9 3H3v18h6m0-9h12m-4-4 4 4-4 4"/></symbol>
    <symbol id="icon-login" viewBox="0 0 24 24"><path d="M15 3h6v18h-6M3 12h12m-4-4 4 4-4 4"/></symbol>
  </defs></svg>

  <div class="head">
    <div class="breadcrumb"></div>
    <div class="toolbox">
      <a class="control action-btn download hidden" aria-label="Download file" download><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-download"/></svg></a>
      <button type="button" class="control action-btn rename-file hidden" data-action="rename" aria-label="Rename file"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-rename"/></svg></button>
      <button type="button" class="control action-btn share-file hidden" data-action="share" aria-label="Share file"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-share"/></svg></button>
      <button type="button" class="control action-btn upload-file hidden" aria-label="Upload files"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-upload"/></svg></button>
      <input type="file" id="file" aria-label="Upload files" multiple hidden>
    </div>
    <form class="searchbar hidden">
      <div class="icon">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path
            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
        </svg>
      </div>
      <input id="search" title="Searching for folders or files" name="q" type="text" maxlength="128" autocomplete="off"
        tabindex="1">
      <input type="submit" hidden />
    </form>
    <div class="toolbox-right">
      <button type="button" class="action-btn login-btn hidden" aria-label="Log in"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-login"/></svg></button>
      <button type="button" class="action-btn logout-btn hidden" aria-label="Log out"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-logout"/></svg><span class="user-name sr-only"></span></button>
      <button type="button" class="action-btn save-btn hidden" aria-label="Save file"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-save"/></svg></button>
    </div>
  </div>
  <div class="main">
    <div class="index-page hidden">
      <div class="empty-folder hidden"></div>
      <table class="uploaders-table hidden">
        <thead>
          <tr>
            <th class="cell-name" colspan="2">Name</th>
            <th class="cell-status">Progress</th>
          </tr>
        </thead>
      </table>
      <table class="paths-table hidden">
        <colgroup>
          <col class="col-icon"><col class="col-name"><col class="col-mtime"><col class="col-size"><col class="col-actions">
        </colgroup>
        <thead>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    <div class="editor-page hidden">
      <div class="not-editable hidden"></div>
      <p id="save-status" role="status"></p>
      <textarea id="editor" class="editor hidden" aria-label="Editor" cols="10"></textarea>
    </div>
  </div>
  <div id="share-popover" class="action-popover" popover>
    <form id="share-form">
      <select id="share-expiry" aria-label="Link expires after">
        <option value="3600">1 hour</option>
        <option value="86400">1 day</option>
        <option value="604800" selected>7 days</option>
        <option value="2592000">30 days</option>
      </select>
      <button type="submit" class="action-btn" aria-label="Copy link"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-copy"/></svg></button>
      <input id="share-link" aria-label="Share link" readonly hidden>
      <p id="share-status" role="status"></p>
    </form>
  </div>
  <div id="rename-popover" class="action-popover" popover>
    <form id="rename-form">
      <input id="rename-input" aria-label="New name" required autocomplete="off">
      <button type="submit" class="action-btn" aria-label="Rename"><svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-check"/></svg></button>
      <p id="rename-status" role="status"></p>
    </form>
  </div>
  <template id="index-data">__INDEX_DATA__</template>
  <script type="module" src="__ASSETS_PREFIX__index.js"></script>
</body>

</html>
