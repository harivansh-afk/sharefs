[package]
name = "sharefs"
version = "0.4.0"
edition = "2021"
default-run = "sharefs"
authors = ["sigoden <sigoden@gmail.com>", "Harivansh Rathi <rathiharivansh@gmail.com>"]
description = "File sharing from your own filesystem"
license = "MIT"
homepage = "https://git.harivan.sh/harivansh-afk/sharefs"
repository = "https://git.harivan.sh/harivansh-afk/sharefs"
categories = ["command-line-utilities", "web-programming::http-server"]
keywords = ["static", "file", "server", "webdav", "cli"]

[dependencies]
alphanumeric-sort = "1.4"
anyhow = "1.0"
async-deflate-zip = "0.2.0"
async-stream = "0.3"
base64 = "0.22"
bytes = "1.5"
chardetng = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["wrap_help", "env"] }
clap_complete = "4.5"
content_inspector = "0.2"
form_urlencoded = "1.2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
glob = "0.3"
headers = "0.4"
hex = "0.4.3"
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
if-addrs = "0.15"
indexmap = "2.2"
lazy_static = "1.4"
log = { version = "0.4", features = ["std"] }
md5 = "0.8"
mime_guess = "2.0"
percent-encoding = "2.3"
pin-project-lite = "0.2"
rustix = { version = "1", features = ["fs"] }
rustls-pki-types = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha-crypt = "0.6"
sha2 = "0.11"
smart-default = "0.7"
socket2 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net"]}
tokio-rustls = { version = "0.26", optional = true }
tokio-util = { version = "0.7",  features = ["io-util", "compat"] }
urlencoding = "2.1"
uuid = { version = "1.7", features = ["v4", "fast-rng"] }
walkdir = "2.3"
xml-rs = "1.0.0"

[features]
default = ["tls"]
tls = ["tokio-rustls"]

[dev-dependencies]
assert_cmd = "2"
reqwest = { version = "0.13", features = ["blocking", "multipart", "rustls"], default-features = false }
assert_fs = "1"
port_check = "0.3"
rstest = "0.26.1"
regex = "1"
url = "2"
predicates = "3"
digest_auth = "0.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
